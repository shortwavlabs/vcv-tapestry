<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 300 370">
  <defs>
    <style>
      .panel { fill: #d7d7d7; }
      .band { fill: #9d9d9d; opacity: 0.95; }
      .guide { stroke: #4a4a4a; stroke-width: 0.4; stroke-dasharray: 2 2; opacity: 0.35; }
      .knob { fill: #1d1d1d; stroke: #0b0b0b; stroke-width: 2; }
      .knob-inner { fill: #cfcfcf; stroke: #ececec; stroke-width: 1.2; }
      .big-knob { fill: #161616; stroke: #070707; stroke-width: 2.4; }
      .switch { fill: #111; stroke: #000; stroke-width: 1.4; }
      .switch-cap { fill: #474747; }
      .jack { fill: #eee; stroke: #8d8d8d; stroke-width: 1.1; }
      .jack-hole { fill: #050505; }
      .light-g { fill: #9cff56; stroke: #6aa93b; stroke-width: 0.8; }
      .light-b { fill: #3c4645; stroke: #1b2020; stroke-width: 0.8; }
      .light-r { fill: #ff5959; stroke: #b83a3a; stroke-width: 0.8; }
      .label { font: 5px Helvetica, Arial, sans-serif; fill: #222; text-anchor: middle; letter-spacing: 0.5px; }
      .note { font: 4px Helvetica, Arial, sans-serif; fill: #333; text-anchor: middle; }
    </style>
  </defs>

