name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: lin-x64
            sdk_url: https://vcvrack.com/downloads/Rack-SDK-latest-lin-x64.zip
          - os: windows-latest
            platform_name: win-x64
            sdk_url: https://vcvrack.com/downloads/Rack-SDK-latest-win-x64.zip
          - os: macos-14
            platform_name: mac-arm64
            sdk_url: https://vcvrack.com/downloads/Rack-SDK-latest-mac-arm64.zip

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------------------
      # Setup Dependencies (Linux)
      # ------------------------------------------------------------------------
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev jq zstd

      # ------------------------------------------------------------------------
      # Setup Dependencies (Mac)
      # ------------------------------------------------------------------------
      - name: Install Dependencies (Mac)
        if: runner.os == 'macOS'
        run: |
          brew install jq zstd

      # ------------------------------------------------------------------------
      # Setup Dependencies (Windows)
      # ------------------------------------------------------------------------
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            unzip
            zip
            jq
            zstd
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-zstd

      # ------------------------------------------------------------------------
      # Download and Setup SDK
      # ------------------------------------------------------------------------
      - name: Setup Rack SDK
        shell: bash
        run: |
          echo "Downloading SDK from ${{ matrix.sdk_url }}"
          curl -L -o Rack-SDK.zip "${{ matrix.sdk_url }}"
          rm -rf sdk-extract
          unzip -q Rack-SDK.zip -d sdk-extract

          if [ -d sdk-extract/include ]; then
            SDK_DIR=sdk-extract
          else
            SDK_DIR=$(find sdk-extract -mindepth 1 -maxdepth 2 -type d -name "Rack-SDK*" | head -n 1)
          fi

          if [ -z "$SDK_DIR" ]; then
            echo "Unable to find extracted Rack SDK directory" >&2
            exit 1
          fi

          mkdir -p dep
          rm -rf dep/Rack-SDK
          mv "$SDK_DIR" dep/Rack-SDK

          if [ ! -f dep/Rack-SDK/include/dsp/filter.hpp ]; then
            echo "Rack SDK was not installed with the expected dep/Rack-SDK layout" >&2
            find dep/Rack-SDK -maxdepth 3 -type d | sort >&2
            exit 1
          fi

          echo "RACK_DIR=$(pwd)/dep/Rack-SDK" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------------
      # Run Tests
      # ------------------------------------------------------------------------
      - name: Run Tests
        shell: bash
        run: |
          chmod +x ./run_tests.sh
          ./run_tests.sh

      # ------------------------------------------------------------------------
      # Build Plugin (Linux/Mac)
      # ------------------------------------------------------------------------
      - name: Build Plugin (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          make dep
          make dist

      # ------------------------------------------------------------------------
      # Build Plugin (Windows)
      # ------------------------------------------------------------------------
      - name: Build Plugin (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Re-export RACK_DIR inside MSYS2 because GITHUB_ENV is not automatically shared
          # in the way make expects for path conversion sometimes, but let's try direct first.
          # Actually, MSYS2 shell inherits env vars, but paths might need care.
          # The SDK is at D:\a\repo\...\dep\Rack-SDK. MSYS2 sees /d/a/repo/...
          # We can just point relatively.

          export RACK_DIR="$(pwd)/dep/Rack-SDK"
          make dep
          make dist

      # ------------------------------------------------------------------------
      # Upload Artifacts
      # ------------------------------------------------------------------------
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapestry-plugin-${{ matrix.platform_name }}
          path: dist/*.vcvplugin
